---
# UAVChum — deploy to rocky (Podman Compose)
# Usage: ansible-playbook deploy/deploy.yml
- name: Deploy uavchum
  hosts: rocky
  become: false
  vars:
    app_dir: /home/cass/uavchum
    archive: /tmp/uavchum-deploy.tar.gz

  tasks:
    # The archive is built from the working tree, so refuse to ship anything
    # that is not exactly origin/main and passing tests.
    - name: Refuse to deploy uncommitted, unpushed or failing code
      ansible.builtin.shell:
        chdir: "{{ playbook_dir }}/.."
        cmd: >
          git diff --quiet HEAD &&
          test -z "$(git status --porcelain)" &&
          git fetch -q origin main &&
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" &&
          go test ./...
      delegate_to: localhost
      changed_when: false

    - name: Ensure app directory exists
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: Create deployment archive
      ansible.builtin.shell:
        cmd: >
          tar -czf {{ archive }}
          --exclude='.git'
          --exclude='uavchum'
          --exclude='uavchum-go'
          --exclude='*.test'
          --exclude='.env'
          --exclude='uavchum.png'
          --exclude='*.md'
          --exclude='docs'
          -C {{ playbook_dir }}/../ .
      delegate_to: localhost
      changed_when: false

    - name: Upload and extract archive
      ansible.builtin.unarchive:
        src: "{{ archive }}"
        dest: "{{ app_dir }}"
        remote_src: false

    - name: Remove local archive
      ansible.builtin.file:
        path: "{{ archive }}"
        state: absent
      delegate_to: localhost
      changed_when: false

  post_tasks:
    - name: Rebuild image and restart stack
      ansible.builtin.shell:
        cmd: |
          podman compose build --no-cache && \
          podman compose up -d --force-recreate
        chdir: "{{ app_dir }}"
      changed_when: true

    - name: Install uavchum-stack user systemd service
      ansible.builtin.copy:
        src: uavchum-stack.service
        dest: "{{ app_dir }}/../.config/systemd/user/uavchum-stack.service"
        mode: "0644"

    - name: Wait for the app to answer
      ansible.builtin.command: >-
        podman exec uavchum_app_1 /bin/busybox
        wget -qO- http://localhost:5555/healthz
      changed_when: false
      until: health.stdout | trim == "ok"
      retries: 10
      delay: 3
      register: health

    - name: Reload user systemd
      ansible.builtin.systemd:
        daemon_reload: true
        scope: user

    - name: Enable and start uavchum-stack user service
      ansible.builtin.systemd:
        name: uavchum-stack
        enabled: true
        state: started
        scope: user
