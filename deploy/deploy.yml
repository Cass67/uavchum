---
# UAVChum — deploy to rocky (Podman Compose)
# Usage: ansible-playbook deploy/deploy.yml
- name: Deploy uavchum
  hosts: rocky
  become: false
  vars:
    app_dir: /home/cass/uavchum
    archive: /tmp/uavchum-deploy.tar.gz

  tasks:
    - name: Ensure app directory exists
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: Create deployment archive
      ansible.builtin.shell:
        cmd: >
          tar -czf {{ archive }}
          --exclude='.git'
          --exclude='uavchum'
          --exclude='uavchum-go'
          --exclude='*.test'
          --exclude='.env'
          --exclude='uavchum.png'
          --exclude='*.md'
          --exclude='docs'
          -C {{ playbook_dir }}/../ .
      delegate_to: localhost
      changed_when: false

    - name: Upload and extract archive
      ansible.builtin.unarchive:
        src: "{{ archive }}"
        dest: "{{ app_dir }}"
        remote_src: false
      notify: Restart stack

    - name: Remove local archive
      ansible.builtin.file:
        path: "{{ archive }}"
        state: absent
      delegate_to: localhost
      changed_when: false

  handlers:
    - name: Restart stack
      ansible.builtin.shell: |
        podman compose build --no-cache && \
        podman compose up -d --force-recreate
        chdir: "{{ app_dir }}"

  post_tasks:
    - name: Install uavchum-stack user systemd service
      ansible.builtin.copy:
        src: uavchum-stack.service
        dest: "{{ app_dir }}/../.config/systemd/user/uavchum-stack.service"
        mode: "0644"

    - name: Reload user systemd
      ansible.builtin.shell: systemctl --user daemon-reload
      changed_when: true

    - name: Enable and start uavchum-stack user service
      ansible.builtin.shell: systemctl --user enable --now uavchum-stack
      changed_when: true
