version: "2"

linters:
  enable:
    - errcheck       # unhandled errors
    - govet          # go vet passes
    - staticcheck    # advanced static analysis (SA*, S*, QF*)
    - gosec          # security issues (CWE coverage)
    - ineffassign    # assigned but never used
    - misspell       # spelling in comments/strings
    - exhaustive     # exhaustive switch on enums
    - noctx          # http requests without context

formatters:
  enable:
    - gofmt          # formatting

linters-settings:
  gosec:
    severity: medium
    confidence: medium

formatters-settings:
  gofmt:
    simplify: true

issues:
  max-issues-per-linter: 50
  max-same-issues: 5
  exclude-rules:
    # G104: errors unhandled — acceptable in deferred Close() calls
    - linters: [gosec]
      text: "G104"
    # Body.Close / conn.Close errors are not actionable after the body has been read
    - linters: [errcheck]
      text: "Close.*is not checked"
